name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/cli/**'
      - 'packages/storytype/**'
      - '.github/workflows/release.yml'
      - '.releaserc.json'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  # Necessario para o trusted publishing do npm (OIDC). Sem isso o publish
  # cai de volta em token e volta a pedir OTP.
  id-token: write

jobs:
  release:
    name: Release to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read tool versions
        id: tool-versions
        run: |
          echo "node-version=$(grep 'nodejs' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "pnpm-version=$(grep 'pnpm' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool-versions.outputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node-version }}
          cache: 'pnpm'
          # Sem `registry-url` de proposito: ele faz o setup-node escrever um
          # .npmrc com `_authToken=${NODE_AUTH_TOKEN}`, e sem token a variavel
          # fica vazia e o placeholder literal vaza para o registry como 404.
          # O registry ja vem do .npmrc do repo.

      # O trusted publishing exige npm >= 11.5.1. O npm que vem junto do Node
      # e mais antigo que isso, entao a atualizacao e obrigatoria.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter @storytype/cli build

      - name: Run tests
        run: pnpm --filter @storytype/cli test

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
