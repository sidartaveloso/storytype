name: Deploy VitePress Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Permissões necessárias para deploy no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deployment por vez
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário para lastUpdated funcionar

      # As versoes saem do .tool-versions, como no release.yml. Fixa-las no yaml
      # deixou este workflow em pnpm 9 enquanto o lockfile passou a ser gerado
      # pelo 10, e o `--frozen-lockfile` parou com
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH: o pnpm 9 le o campo `overrides` de
      # forma diferente do 10.
      - name: Read tool versions
        id: tool-versions
        run: |
          echo "node-version=$(grep 'nodejs' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "pnpm-version=$(grep 'pnpm' .tool-versions | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.tool-versions.outputs.pnpm-version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool-versions.outputs.node-version }}
          cache: 'pnpm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build VitePress site
        run: pnpm --filter docs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment: github-pages
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
